image: node:20-alpine

variables:
  PROJECT_NAME: "high"
  DEPLOY_USER: "root"
  DEPLOY_PATH: "/var/www/work/${PROJECT_NAME}"

before_script:
  # Проверка наличия SSH-ключа
  - |
    if [ -n "$DEPLOY_SSH_PRIVATE_KEY" ]; then
      echo "DEPLOY_SSH_PRIVATE_KEY is set"
    else
      echo "ERROR: DEPLOY_SSH_PRIVATE_KEY is empty or not set"
    fi
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - |
    if [ -n "$DEPLOY_SSH_PRIVATE_KEY" ]; then
      echo "$DEPLOY_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
      echo "SSH key configured"
    fi

stages:
  - build
  - deploy
  - mirror

# Этап сборки (общий для всех)
build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
  only:
    - main

# Деплой в GitLab Pages и на внешний сервер
pages:
  stage: deploy
  script:
    # GitLab Pages (старый сервер)
    - mkdir -p /var/opt/gitlab/gitlab-rails/shared/pages/root/work/$PROJECT_NAME
    - cp -rv dist/* /var/opt/gitlab/gitlab-rails/shared/pages/root/work/$PROJECT_NAME/

    # Внешний сервер (новый)
    - |
      if [ -n "$DEPLOY_SSH_PRIVATE_KEY" ]; then
        echo "Deploying to new server ${DEPLOY_HOST}..."
        ssh ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
        scp -r dist/* ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/  # 🔧 Исправлено: правильные переменные
        echo "Deploy to new server completed"
      else
        echo "SSH key not configured, skipping deploy to new server"
      fi
  dependencies:
    - build
  artifacts:
    paths:
      - dist/
    publish: dist/
  only:
    - main

# Зеркалирование на GitHub (отдельный этап)
mirror_to_github:
  stage: mirror
  script:
    - git push https://paveltomilov:${GITHUB_TOKEN}@github.com/paveltomilov/${PROJECT_NAME}.git HEAD:main || true
  only:
    - main
  needs: [] # Запускается независимо от сборки
